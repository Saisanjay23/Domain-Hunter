[pytest]
testpaths = tests
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # mongomock's TTL emulation calls datetime.utcnow() internally (library code, not ours)
    ignore:datetime.datetime.utcnow:DeprecationWarning:mongomock
markers =
    ui: browser tests (Playwright); skipped when no browser is installed
