<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" fill="none">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f3478"/>
    </linearGradient>
    <filter id="cardDrop" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- Soft breathing halo -->
  <circle cx="230" cy="180" r="165" fill="url(#halo)"/>
  <circle cx="230" cy="180" r="126" stroke="#cbd5e1" stroke-dasharray="5 6" stroke-width="1.2"/>
  <circle cx="230" cy="180" r="88" stroke="#bfdbfe" stroke-width="1.4"/>

  <!-- Main Protected Brand Anchor Card -->
  <g filter="url(#cardDrop)">
    <rect x="78" y="106" width="304" height="148" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="78" y="106" width="5" height="148" rx="2.5" fill="#059669"/>
    <circle cx="116" cy="144" r="18" fill="#ecfdf5"/>
    <path d="M116 135l7 3v5c0 4.5-3 8.2-7 9.5-4-1.3-7-5-7-9.5v-5l7-3z" fill="url(#shieldGrad)"/>
    <text x="144" y="141" fill="#0f172a" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="15" font-weight="800">official-brand.com</text>
    <text x="144" y="158" fill="#059669" font-family="Inter, sans-serif" font-size="11.5" font-weight="600">Protected Brand · Favicon &amp; SSL Fingerprinted</text>

    <!-- Engine strip inside card -->
    <rect x="102" y="182" width="80" height="26" rx="13" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="142" y="199" text-anchor="middle" fill="#5b21b6" font-family="Inter, sans-serif" font-size="11" font-weight="700">URLScan 24h</text>
    <rect x="190" y="182" width="76" height="26" rx="13" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="228" y="199" text-anchor="middle" fill="#0f766e" font-family="Inter, sans-serif" font-size="11" font-weight="700">crt.sh CT</text>
    <rect x="274" y="182" width="84" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="316" y="199" text-anchor="middle" fill="#1d4ed8" font-family="Inter, sans-serif" font-size="11" font-weight="700">Daily NRD</text>
    <text x="102" y="232" fill="#64748b" font-family="Inter, sans-serif" font-size="11.5">Continuous lookalike detection across 6 free open engines</text>
  </g>

  <!-- Intercepted Threat Pill Top Right -->
  <g filter="url(#cardDrop)">
    <rect x="206" y="24" width="228" height="62" rx="14" fill="#ffffff" stroke="#fecdd3" stroke-width="1.2"/>
    <rect x="206" y="24" width="4" height="62" rx="2" fill="#dc2626"/>
    <rect x="222" y="38" width="32" height="32" rx="9" fill="#fef2f2"/>
    <text x="238" y="59" text-anchor="middle" fill="#991b1b" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800">92</text>
    <text x="266" y="49" fill="#0f172a" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">brand-login-verify.com</text>
    <text x="266" y="68" fill="#991b1b" font-family="Inter, sans-serif" font-size="11" font-weight="600">Phishing · Cloned Title + Password</text>
  </g>

  <!-- Newly Registered Alert Bottom Left -->
  <g filter="url(#cardDrop)">
    <rect x="26" y="274" width="224" height="60" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
    <rect x="26" y="274" width="4" height="60" rx="2" fill="#d97706"/>
    <rect x="42" y="288" width="32" height="32" rx="9" fill="#fffbeb"/>
    <text x="58" y="309" text-anchor="middle" fill="#92400e" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800">64</text>
    <text x="86" y="299" fill="#0f172a" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">brand-portal.shop</text>
    <text x="86" y="317" fill="#92400e" font-family="Inter, sans-serif" font-size="11" font-weight="600">Registered 2d ago · crt.sh + NRD</text>
  </g>
</svg>
